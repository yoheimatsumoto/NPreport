<script>
// Simple hash for client-side gate (not cryptographic security, but sufficient for casual sharing)
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const HASH = '9e1a417e930f9a1c4c40e8cbae1b50f4b3d18e5fd6c0e8eac2e5a9b1b6f7c285';

// Pre-compute the actual hash on first load (we'll set it below)
let correctHash = '';
(async () => {
  correctHash = await sha256('NonaltzBee2026');
})();

const input = document.getElementById('pw-input');
const btn = document.getElementById('pw-btn');
const err = document.getElementById('pw-error');

async function tryUnlock() {
  const val = input.value;
  const hash = await sha256(val);
  if (hash === correctHash) {
    document.getElementById('password-gate').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    // Initialize React app after unlock
    initApp();
  } else {
    input.classList.add('error');
    err.textContent = 'パスワードが正しくありません';
    setTimeout(() => { input.classList.remove('error'); }, 500);
  }
}

btn.addEventListener('click', tryUnlock);
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
</script>

              { icon: "🇯🇵", title: "日本人の推薦者がいると強い", body: "博士だけの権威訴求よりも、日本人教授や愛用者の顔が入ると共感・自分事化が進む。" },
              { icon: "✂️", title: "コピーは短いほど効く", body: "NP01（CPO 5.7万）とNP08（CPO 11.2万）は構成がほぼ同じ。違いはコピーの長さだけ。説明を足すと感情が希釈される。" },
            ].map((insight, i) => (
              <div key={i} style={{ padding: "14px", background: "rgba(255,255,255,0.07)", borderRadius: "8px" }}>
                <div style={{ fontSize: "13px", fontWeight: 700, marginBottom: "4px" }}>{insight.icon} {insight.title}</div>
                <div style={{ fontSize: "12px", color: "rgba(255,255,255,0.75)", lineHeight: "1.6" }}>{insight.body}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ marginTop: "16px", fontSize: "11px", color: "#aaa", textAlign: "right" }}>
          ※ CPOは新聞出稿実績に基づく ｜ 各行クリックで詳細展開
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
